<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SET</title>
</head>
<body>
<script>
(async () => {
  const SOURCE_URL = "https://raw.githubusercontent.com/hermannlaszlo/setsetset/24f9e6534ae2a84f71c6799e709131a5f9913531/index.html";

  function mustReplace(source, from, to, label) {
    if (!source.includes(from)) {
      throw new Error("SET host-fix patch anchor missing: " + label);
    }
    return source.replace(from, to);
  }

  try {
    const response = await fetch(SOURCE_URL, { cache: "no-store" });
    if (!response.ok) throw new Error("Base application download failed: HTTP " + response.status);
    let source = await response.text();

    source = mustReplace(
      source,
      "  let clientId = crypto.randomUUID ? crypto.randomUUID() : Math.random().toString(36).slice(2);",
      `  const CLIENT_ID_SESSION_KEY = 'set-client-id';
  let clientId = sessionStorage.getItem(CLIENT_ID_SESSION_KEY);
  if (!clientId) {
    clientId = crypto.randomUUID ? crypto.randomUUID() : Math.random().toString(36).slice(2);
    sessionStorage.setItem(CLIENT_ID_SESSION_KEY, clientId);
  }`,
      "stable client id"
    );

    source = mustReplace(
      source,
      "  const HIDE_MS = 180000;",
      `  const HIDE_MS = 180000;
  // The host heartbeat runs every 30 seconds. After two missed heartbeats
  // plus a grace period, another active player may take over atomically.
  const HOST_STALE_MS = 70000;`,
      "host stale timeout"
    );

    source = mustReplace(
      source,
      "  async function startGuestP2P() {",
      `  function isHostRecordStale(room, now = Date.now()) {
    if (!room?.host_client_id) return true;
    const ts = Date.parse(room.last_activity_at || '');
    return !Number.isFinite(ts) || (now - ts) > HOST_STALE_MS;
  }

  async function tryTakeOverStaleHost(latestRoom = null) {
    const latest = latestRoom || await fetchRoom();
    const oldHost = latest?.host_client_id || null;

    if (!oldHost) return false;
    if (oldHost === clientId) return true;
    if (!isHostRecordStale(latest)) return false;

    const cutoff = new Date(Date.now() - HOST_STALE_MS).toISOString();
    const { data, error } = await db
      .from('rooms')
      .update({
        host_client_id: clientId,
        host_name: playerName,
        last_activity_at: new Date().toISOString()
      })
      .eq('name', roomName)
      .eq('host_client_id', oldHost)
      .lt('last_activity_at', cutoff)
      .select('name,host_client_id,host_name,last_activity_at')
      .maybeSingle();

    if (error) throw error;

    if (data?.host_client_id === clientId) {
      hostClientId = clientId;
      if (roomState) {
        roomState.host_client_id = clientId;
        roomState.host_name = playerName;
        roomState.last_activity_at = data.last_activity_at;
      }
      return true;
    }

    // Another client may have won the takeover race.
    const refreshed = await fetchRoom();
    hostClientId = refreshed?.host_client_id || null;
    return hostClientId === clientId;
  }

  async function startGuestP2P() {`,
      "stale host helpers"
    );

    source = mustReplace(
      source,
      `    const latestRoom = await fetchRoom();
    hostClientId = latestRoom?.host_client_id || hostClientId;
    if (!hostClientId) throw new Error('No active host for WebRTC');
    if (hostClientId === clientId) {
      await closeGuestPeerOnly();
      await startHostP2P();
      return;
    }

    hostPeer = new RTCPeerConnection(RTC_CONFIG);`,
      `    const latestRoom = await fetchRoom();
    hostClientId = latestRoom?.host_client_id || hostClientId;
    if (!hostClientId) throw new Error('No active host for WebRTC');

    if (hostClientId === clientId || await tryTakeOverStaleHost(latestRoom)) {
      await closeGuestPeerOnly();
      await startHostP2P();
      return;
    }

    hostPeer = new RTCPeerConnection(RTC_CONFIG);`,
      "pre-offer stale host check"
    );

    source = mustReplace(
      source,
      `    setTimeout(() => {
      if (
        gameMode === 'table' &&
        !isHostClient &&
        (!hostDataChannel || hostDataChannel.readyState !== 'open')
      ) {
        setP2PPhase('retry');
        scheduleGuestReconnect('connect-timeout');
      }
    }, 12000);`,
      `    setTimeout(async () => {
      if (
        gameMode === 'table' &&
        !isHostClient &&
        (!hostDataChannel || hostDataChannel.readyState !== 'open')
      ) {
        setP2PPhase('retry');
        try {
          const latest = await fetchRoom();
          hostClientId = latest?.host_client_id || hostClientId;

          if (hostClientId === clientId || await tryTakeOverStaleHost(latest)) {
            await closeGuestPeerOnly();
            await startHostP2P();
            return;
          }
        } catch (err) {
          console.error('P2P stale-host recovery', err);
        }

        scheduleGuestReconnect('connect-timeout');
      }
    }, 12000);`,
      "stale host recovery after failed handshake"
    );

    document.open();
    document.write(source);
    document.close();
  } catch (err) {
    console.error(err);
    document.body.innerHTML =
      '<main style="font:16px system-ui;padding:24px;max-width:720px;margin:auto">' +
      '<h1>SET</h1><p>Az alkalmazás betöltése nem sikerült.</p><pre style="white-space:pre-wrap"></pre></main>';
    document.querySelector('pre').textContent = String(err && err.stack || err);
  }
})();
</script>
</body>
</html>
